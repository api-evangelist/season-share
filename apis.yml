aid: season-share
name: Season Share
description: Season Share (SeasonShare) is a ticketing technology platform for sports and entertainment
  venues. Its subscription-pass, last-minute, student, and credit-based products — Pass, Flow, Flex, and
  LivePass — help teams and venues reach younger fans, capture first-party data, and build recurring
  ticket revenue. It reports $100M+ in ticket inventory delivered and 1.5M tickets purchased, and is used
  by 30+ franchises including the Sacramento Kings, New Jersey Devils, Arizona Diamondbacks, and Nashville
  Predators. This profile was surfaced as a Techstars portfolio company; no public API, developer portal,
  or OpenAPI surface was found during enrichment.
